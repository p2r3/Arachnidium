name: Docker image

on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, ubuntu-24.04-arm]
    runs-on: ${{ matrix.os }}
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4

      - uses: docker/setup-buildx-action@v3

      - name: Build
        uses: docker/build-push-action@v6
        with:
          context: .
          load: true
          tags: arachnidium:test
          cache-from: type=gha,scope=${{ runner.arch }}
          cache-to: type=gha,scope=${{ runner.arch }},mode=max

      - name: Smoke test
        run: |
          docker run -d --name arachnidium arachnidium:test
          for i in $(seq 60); do
            [ "$(docker inspect -f '{{.State.Running}}' arachnidium)" = true ] || exit 1
            docker exec arachnidium test -s /data/wireguard.cfg && break
            sleep 1
          done
          docker exec arachnidium python -c "
          import urllib.request
          req = urllib.request.Request('http://localhost:3000/api/minify/css', data=b'a { color : red ; }')
          assert urllib.request.urlopen(req).read().strip() == b'a{color:red}'
          "
          docker logs arachnidium 2>&1 | grep -q 'WireGuard server listening'
          docker exec arachnidium test -s /data/wg-keys.json

      - name: Container logs
        if: always()
        run: docker logs arachnidium || true

  publish:
    needs: test
    if: github.event_name == 'push'
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@v4

      - uses: docker/setup-qemu-action@v3

      - uses: docker/setup-buildx-action@v3

      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - id: meta
        uses: docker/metadata-action@v5
        with:
          images: ghcr.io/${{ github.repository }}
          tags: |
            type=raw,value=latest
            type=sha

      - uses: docker/build-push-action@v6
        with:
          context: .
          platforms: linux/amd64,linux/arm64
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: |
            type=gha,scope=X64
            type=gha,scope=ARM64
